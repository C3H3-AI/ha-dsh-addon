name: "DeepSeek Harness"
version: "0.2.20"
slug: "deepseek_harness"
description: "DeepSeek Harness - 开源 AI Agent 运行框架，一切皆插件"
url: "https://github.com/deepseek-ai/deepseek-harness"
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
ingress: true
ingress_port: 3080
panel_icon: "mdi:whale"
panel_title: "DSH Agent"
homeassistant: "2024.1.0"
hassio_api: true
map:
  - config:rw
options:
  api_key: ""
  api_token: ""
  model: "deepseek-v4-flash"
  provider: "deepseek-official"
  base_url: ""
  # workspace: DSH 工作区路径，默认 /config（HA 配置目录，持久化）。
  # 如需自定义，务必选择持久化路径（/config 或 /data 下），
  # 否则容器重建后工作区内容会丢失（DESIGN.md §4）。
  workspace: ""
  preset: "standard"
  auto_start: true
  api_port: 3082
  ha_mcp_enabled: false
  ha_mcp_url: ""
  ha_mcp_token: ""
schema:
  api_key: "password"
  api_token: "password"
  model: "str"
  provider: "str"
  base_url: "str"
  workspace: "str"
  preset: "list(standard|code|minimal|creator)"
  auto_start: "bool"
  api_port: "port"
  ha_mcp_enabled: "bool"
  ha_mcp_url: "str"
  ha_mcp_token: "password"