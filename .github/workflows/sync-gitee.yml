name: Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:   # 支持手动触发

jobs:
  sync:
    name: Mirror GitHub -> Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 拉取全部历史
          ref: main

      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 推送所有分支和 tag 到 Gitee
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/C3H3-AI/ha-dsh-addon.git"
          git push --force --all gitee
          git push --force --tags gitee
          echo "✅ 已同步到 Gitee: https://gitee.com/C3H3-AI/ha-dsh-addon"
